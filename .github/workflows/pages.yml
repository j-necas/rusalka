# Builds the static Rusalka web (npm run web) and deploys it to GitHub Pages.
# Enable it in the repository settings: Settings → Pages → Source: GitHub Actions.
# Actions are pinned to a commit (the comment says which release); update them by changing the SHA and the comment.
name: Web (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web
      # the built website still opens offline and updates file by file (headless Chrome; Chrome is on the runner)
      - name: Offline check of web/
        run: |
          npm install --no-save playwright-core@1.65.1
          PLAYWRIGHT_CORE="$PWD/node_modules/playwright-core" CHROME="$(command -v google-chrome)" node tools/check-offline.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: nasazeni
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
